<!DOCTYPE html>
<html>
<body>
    <img id="source" src="/images/logo-smbsd-orange.png" crossorigin="anonymous" onload="processImage()" style="display:none;">
    <div id="result"></div>
    <script>
        function processImage() {
            const img = document.getElementById('source');
            const canvas = document.createElement('canvas');
            canvas.width = img.width;
            canvas.height = img.height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0);
            
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imageData.data;
            
            // Threshold for white
            const threshold = 240;
            
            for (let i = 0; i < data.length; i += 4) {
                const r = data[i];
                const g = data[i + 1];
                const b = data[i + 2];
                
                // If pixel is near white
                if (r > threshold && g > threshold && b > threshold) {
                    data[i + 3] = 0; // Make transparent
                }
            }
            
            ctx.putImageData(imageData, 0, 0);
            
            // Get base64
            const base64 = canvas.toDataURL('image/png');
            document.getElementById('result').textContent = base64;
            
            // Show for debugging
            const newImg = document.createElement('img');
            newImg.src = base64;
            document.body.appendChild(newImg);
            document.body.style.backgroundColor = '#ccc'; // Show transparency
        }
    </script>
</body>
</html>
